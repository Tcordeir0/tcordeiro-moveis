plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Testes automáticos num servidor real (fora do jar final).
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tmoveis" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"tmoveis-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		gametest {
			server()
			name "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "build/gametest"
		}
	}
}

sourceSets.gametest {
	compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
	runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Industrial (opcional): com ele instalado as lâmpadas também acendem com energia dos cabos/Fio de Cobre.
	// Só para compilar a classe de compatibilidade (compat/PoweredLampBlockEntity), que só é carregada se o Industrial existir.
	// A versão vem do gradle.properties do Industrial (o jar atual, como no Receitário).
	// Se esse jar ainda não foi construído (versão acabada de subir), usa o mais recente que houver em build/libs.
	def industrialProps = new Properties()
	file("${rootDir}/../tcordeiro-industrial/gradle.properties").withInputStream { industrialProps.load(it) }
	def industrialLibs = file("${rootDir}/../tcordeiro-industrial/build/libs")
	def industrialJar = new File(industrialLibs, "tcordeiro-industrial-${industrialProps.getProperty('version')}.jar")
	if (!industrialJar.exists()) {
		industrialJar = (industrialLibs.listFiles() ?: [] as File[]).findAll { it.name ==~ /tcordeiro-industrial-[0-9.]+\.jar/ }
				.max { it.lastModified() }
	}
	def industrial = files(industrialJar ?: [])
	compileOnly industrial
	// ./gradlew runGametest -PnoIndustrial : os mesmos testes sem o Industrial (as lâmpadas só com redstone)
	if (!project.hasProperty('noIndustrial')) gametestRuntimeOnly industrial

	// Testes rápidos da lógica pura (verniz e desgaste), sem o jogo
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
